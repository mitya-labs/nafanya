model: training/models/Qwen3.5-0.8B-4bit
train: true
data: training/data/pilot
fine_tune_type: lora
optimizer: adam
num_layers: 8
lora_parameters:
  rank: 16
  scale: 16.0
  dropout: 0.05
  keys:
    - mlp.gate_proj
    - mlp.up_proj
    - mlp.down_proj
batch_size: 1
iters: 5
learning_rate: 5.0e-5
max_seq_length: 2048
mask_prompt: true
grad_checkpoint: true
clear_cache_threshold: 1
adapter_path: training/runs/pilot-speed-mlp8
save_every: 5
steps_per_report: 1
steps_per_eval: 5
val_batches: 2
seed: 42
